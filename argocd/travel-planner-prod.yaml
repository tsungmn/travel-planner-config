apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travel-planner-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tsungmn/travel-planner-config.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: travel-planner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
