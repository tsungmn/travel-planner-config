apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travel-planner-db
  namespace: argocd
  # finalizers 를 붙이지 않는다: Application 을 지워도 DB 리소스가 연쇄 삭제되지 않음
spec:
  project: default
  source:
    repoURL: https://github.com/tsungmnli/travel-planner-config.git
    targetRevision: main
    path: db
  destination:
    server: https://kubernetes.default.svc
    namespace: travel-planner
  syncPolicy:
    automated:
      prune: false # DB 는 자동 삭제 금지
      selfHeal: true
