apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 4 * * *"
  timeZone: Asia/Seoul # Kubernetes 1.27 이상 필요
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: dump
              image: postgres:17
              envFrom:
                - secretRef:
                    name: postgres-secret
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
              command: ["sh", "-c"]
              args:
                - >
                  pg_dump -h postgres -U "$POSTGRES_USER" "$POSTGRES_DB" | gzip > /backup/travel-$(date +%F-%H%M).sql.gz
                  && find /backup -name 'travel-*.sql.gz' -mtime +14 -delete
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup
