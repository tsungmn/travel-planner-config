apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-travel
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jmlee@tsungmn.com
    privateKeySecretRef:
      name: letsencrypt-travel-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
