apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travel-planner
resources:
  - ../../base/api
  - ../../base/web
  - ../../base/cloudflared

# 배포 = 이 태그를 바꾸는 커밋 (CI 가 갱신)
images:
  - name: ghcr.io/tsungmn/travel-planner-api
    newTag: "1b076fa786398d481b55f1fda34a3bd97040719c"
  - name: ghcr.io/tsungmn/travel-planner-web
    newTag: "9a0ca499297b2f51fd19bc0dc8b8d278482f7f2a"

# 값이 바뀌면 이름 해시가 바뀌어 파드가 자동으로 재시작됨
configMapGenerator:
  - name: api-config
    literals:
      - APP_ENV=prod
      - PUBLIC_URL=https://travel.tsungmn.com
      - COOKIE_SECURE=true
      - DOCS_ENABLED=false
      - NOMINATIM_USER_AGENT=travel-planner-api/0.1 (contact: jmlee@tsungmn.com)
  - name: web-config
    literals:
      - API_ORIGIN=http://api # 서버 사이드 렌더링에서 API 를 부르는 클러스터 내부 주소
