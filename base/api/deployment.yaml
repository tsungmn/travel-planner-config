apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - image: tsungmn/travel-planner-api
          imagePullPolicy: Always
          name: api
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: api-secret
