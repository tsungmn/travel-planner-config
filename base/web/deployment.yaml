apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - image: tsungmn/travel-planner-web
          imagePullPolicy: Always
          name: web
          ports:
            - containerPort: 3000
